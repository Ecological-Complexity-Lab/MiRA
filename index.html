<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Interactive multilayer network visualizer for EMLN ecological network data with 3D-layered perspective rendering.">
  <title>Multilayer Network Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Main Canvas -->
  <canvas id="networkCanvas"></canvas>

  <!-- Tooltip (follows mouse on hover) -->
  <div id="tooltip"></div>

  <!-- Control Panel -->
  <div id="controlPanel" class="panel">
    <h2>Multilayer Viz</h2>

    <div class="control-group">
      <label>Data</label>
      <div class="btn-row">
        <select id="demoSelect" class="styled-select" style="flex:1;">
          <option value="demo_directed">Directed/Weighted (10)</option>
          <option value="demo_large">Large ER (50)</option>
          <option value="demo_bipartite">Bipartite (Plant-Poll.)</option>
        </select>
        <button id="loadDemoBtn" class="btn btn-primary" style="white-space:nowrap;">Load</button>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <div class="file-input-wrapper">
          <button class="btn" id="uploadLabel">📂 Upload JSON</button>
          <input type="file" id="fileInput" accept=".json">
        </div>
      </div>
    </div>

    <div class="separator"></div>

    <div class="control-group">
      <label>Display</label>
      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showLabelsCheckbox">
          <span>Node Labels</span>
        </label>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showLayerNamesCheckbox">
          <span>Layer Names</span>
        </label>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showSetNamesCheckbox">
          <span>Set Names</span>
        </label>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showInterlayerCheckbox" checked>
          <span>Interlayer Links</span>
        </label>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <label style="font-size:11px;color:#666;margin-right:6px;">Stacking:</label>
        <div class="toggle-group">
          <button id="stackHorizontalBtn" class="btn toggle-btn active" data-mode="horizontal">Horizontal</button>
          <button id="stackVerticalBtn" class="btn toggle-btn" data-mode="vertical">Vertical</button>
        </div>
      </div>
      <div style="margin-top:8px;">
        <label style="font-size:11px;color:#666;">Layer Spacing</label>
        <input type="range" id="layerSpacingSlider" min="100" max="600" value="300" class="slider">
      </div>
    </div>

    <div class="separator"></div>

    <div class="control-group">
      <label>Layout</label>
      <select id="layoutSelect" class="styled-select">
        <option value="fruchterman">Fruchterman-Reingold</option>
        <option value="kamada_kawai">Kamada-Kawai</option>
        <option value="bipartite">Bipartite (two-row)</option>
        <option value="circle">Circle</option>
        <option value="grid">Grid</option>
        <option value="random">Random</option>
      </select>
      <div style="margin-top:8px;">
        <label style="font-size:11px;color:#666;">Node Size</label>
        <input type="range" id="nodeSizeSlider" min="3" max="25" value="10" class="slider">
      </div>
    </div>

    <div class="separator"></div>

    <div class="control-group">
      <label>Node Color By</label>
      <select id="nodeColorSelect" class="styled-select" disabled>
        <option value="">Layer (default)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Link Color By</label>
      <select id="linkColorSelect" class="styled-select" disabled>
        <option value="">Type (default)</option>
      </select>
    </div>

    <div class="separator"></div>

    <div class="control-group">
      <label>Zoom</label>
      <div class="zoom-controls">
        <button id="zoomInBtn" class="btn zoom-btn">+</button>
        <button id="zoomOutBtn" class="btn zoom-btn">−</button>
        <button id="zoomResetBtn" class="btn" style="font-size: 11px;">Reset</button>
      </div>
      <div class="interaction-hints">
        <span>drag: rotate 3D</span>
        <span>⇧+drag: pan</span>
        <span>⌘+drag: move layer</span>
      </div>
    </div>
  </div>

  <!-- Info Panel (shown when a node is selected) -->
  <div id="infoPanel" class="panel">
    <button id="closeInfoBtn" class="close-btn">✕</button>
    <h3 id="infoTitle">Node Info</h3>
    <div id="infoContent"></div>
  </div>



  <script type="module" src="js/app.js"></script>
</body>

</html>
