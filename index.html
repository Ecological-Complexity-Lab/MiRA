<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Interactive multilayer network visualizer for EMLN ecological network data with 3D-layered perspective rendering.">
  <title>Multilayer Network Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Main Canvas -->
  <canvas id="networkCanvas"></canvas>

  <!-- Tooltip (follows mouse on hover) -->
  <div id="tooltip"></div>

  <!-- Control Panels (top-left, collapsible) -->
  <div id="controlPanels">

    <!-- 1. Data -->
    <details class="control-section" id="sectionData">
      <summary>Data</summary>
      <div class="section-body">
        <div class="btn-row" style="flex-direction: column; gap: 8px;">
          <button id="openDemoDialogBtn" class="btn btn-primary" style="width:100%;">Load Example Data</button>
          <div class="file-input-wrapper" style="width:100%;">
            <button class="btn" id="uploadLabel" style="width:100%;">📂 Load User Data (JSON)</button>
            <input type="file" id="fileInput" accept=".json">
          </div>
        </div>
      </div>
    </details>

    <!-- 2. Layers -->
    <details class="control-section" id="sectionLayers">
      <summary>Layers</summary>
      <div class="section-body">
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="showLayerNamesCheckbox">
            <span>Layer Names</span>
          </label>
        </div>

        <div class="btn-row" style="margin-top:6px;">
          <label style="font-size:11px;color:#666;margin-right:6px;">Stacking:</label>
          <div class="toggle-group">
            <button id="stackHorizontalBtn" class="btn toggle-btn active" data-mode="horizontal">Horizontal</button>
            <button id="stackVerticalBtn" class="btn toggle-btn" data-mode="vertical">Vertical</button>
          </div>
        </div>
        <div style="margin-top:8px;">
          <label style="font-size:11px;color:#666;">Layer Spacing</label>
          <input type="range" id="layerSpacingSlider" min="100" max="600" value="300" class="slider">
        </div>
        <div class="checkbox-row" id="setNamesContainer" style="display:none;">
          <label class="checkbox-label" style="display:block;">
            <input type="checkbox" id="showSetNamesCheckbox">
            <span>Set Names</span>
          </label>
          <label class="checkbox-label" style="display:block; margin-top: 4px;">
            <input type="checkbox" id="bipartiteNestedCheckbox">
            <span>Nested Sorting</span>
          </label>
        </div>
        <div style="margin-top:6px;">
          <label style="font-size:11px;color:#666;">Layout</label>
          <select id="layoutSelect" class="styled-select">
            <option value="fruchterman">Fruchterman-Reingold</option>
            <option value="kamada_kawai">Kamada-Kawai</option>
            <option value="bipartite">Bipartite (two-row)</option>
            <option value="circle">Circle</option>
            <option value="grid">Grid</option>
            <option value="random">Random</option>
          </select>
        </div>
      </div>
    </details>

    <!-- 3. Nodes -->
    <details class="control-section" id="sectionNodes">
      <summary>Nodes</summary>
      <div class="section-body">
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="showLabelsCheckbox">
            <span>Node Labels</span>
          </label>
          <div class="checkbox-row" style="margin-top: 6px;">
            <label class="checkbox-label">
              <input type="checkbox" id="transformNodesCheckbox" checked
                title="Shapes nodes to match 3D layer perspective (may impact performance on large networks)">
              <span>Transform Nodes</span>
            </label>
          </div>

          <div style="margin-top:8px;" id="colorByContainer">
            <label style="font-size:11px;color:#666;">Color By</label>
            <select id="nodeColorSelect" class="styled-select" disabled>
              <option value="">Layer (default)</option>
            </select>
          </div>
          <div style="margin-top:8px; display:none;" id="bipartiteColorByContainer">
            <label style="font-size:11px;color:#666;" id="bipartiteColorLabelA">Color By Set A</label>
            <select id="nodeColorSelectSetA" class="styled-select" disabled>
              <option value="">Set Default</option>
            </select>
            <label class="checkbox-label" style="margin-top:4px;">
              <input type="checkbox" id="showNodeColorSetALegend">
              <span style="font-size:11px;">Show Legend</span>
            </label>

            <label style="font-size:11px;color:#666; margin-top:6px; display:block;" id="bipartiteColorLabelB">Color By
              Set B</label>
            <select id="nodeColorSelectSetB" class="styled-select" disabled>
              <option value="">Set Default</option>
            </select>
            <label class="checkbox-label" style="margin-top:4px;">
              <input type="checkbox" id="showNodeColorSetBLegend">
              <span style="font-size:11px;">Show Legend</span>
            </label>
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px;color:#666;">Size By</label>
            <select id="nodeSizeSelect" class="styled-select" disabled>
              <option value="">Uniform (slider)</option>
            </select>
          </div>
          <div style="margin-top:8px;">
            <label style="font-size:11px;color:#666;">Base Size</label>
            <input type="range" id="nodeSizeSlider" min="3" max="25" value="10" class="slider">
          </div>
        </div>
    </details>

    <!-- 4. Links -->
    <details class="control-section" id="sectionLinks">
      <summary>Links</summary>
      <div class="section-body">
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="showInterlayerCheckbox" checked>
            <span>Interlayer Links</span>
          </label>
        </div>
        <div style="margin-top:6px;">
          <label style="font-size:11px;color:#666;">Color By</label>
          <select id="linkColorSelect" class="styled-select" disabled>
            <option value="">Type (default)</option>
          </select>
        </div>
      </div>
    </details>

  </div>

  <!-- Bottom-left: Zoom & interaction hints -->
  <div id="bottomPanel" class="panel">
    <div class="zoom-controls">
      <button id="zoomInBtn" class="btn zoom-btn">+</button>
      <button id="zoomOutBtn" class="btn zoom-btn">−</button>
      <button id="zoomResetBtn" class="btn" style="font-size: 11px;">Reset</button>
      <button id="captureBtn" class="btn zoom-btn" title="Save screenshot">
        <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor">
          <path
            d="M149.1 64.8L138.7 96H64C28.7 96 0 124.7 0 160V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V160c0-35.3-28.7-64-64-64H373.3L362.9 64.8C356.4 45.2 338.1 32 317.4 32H194.6c-20.7 0-39 13.2-45.5 32.8zM256 384c-53 0-96-43-96-96s43-96 96-96s96 43 96 96s-43 96-96 96z" />
        </svg>
      </button>
    </div>
    <div class="interaction-hints">
      <span>drag: rotate 3D</span>
      <span>⇧+drag: pan</span>
      <span>⌘+drag: move layer</span>
      <span>click layer: info</span>
    </div>
  </div>

  <!-- Bottom-right: Branding -->
  <div id="brandingPanel">
    <span class="branding-title">Multilayer Viz</span>
    <a href="https://github.com/Ecological-Complexity-Lab/multilayer_viz" target="_blank" rel="noopener"
      title="GitHub Repository" class="branding-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
      </svg>
    </a>
    <a href="https://ecomplab.com" target="_blank" rel="noopener" title="Ecological Complexity Lab"
      class="branding-link">
      <img src="assets/ecomplab_logo.png" alt="ECompLab" class="branding-icon">
    </a>
  </div>

  <!-- Legend Panel (right edge) -->
  <div id="legendPanel"
    style="position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto; pointer-events: none; z-index: 10;">
  </div>

  <!-- Info Panel (shown when a node/layer is selected) -->
  <div id="infoPanel" class="panel">
    <button id="closeInfoBtn" class="close-btn">✕</button>
    <h3 id="infoTitle">Node Info</h3>
    <div id="infoContent"></div>
  </div>

  <!-- Export format dialog -->
  <div id="exportDialog" class="dialog-overlay" style="display:none;">
    <div class="dialog-box">
      <h4>Export Format</h4>
      <p>Choose a format for the screenshot:</p>
      <div class="dialog-options">
        <label class="checkbox-label">
          <input type="checkbox" id="exportGridCheckbox" checked>
          <span>Background grid</span>
        </label>
      </div>
      <div class="dialog-buttons">
        <button class="btn btn-primary" data-format="png">PNG</button>
        <button class="btn btn-primary" data-format="jpg">JPG</button>
        <button class="btn btn-primary" data-format="pdf">PDF</button>
        <button class="btn" id="exportCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Demo selection dialog -->
  <div id="demoDialog" class="dialog-overlay" style="display:none;">
    <div class="dialog-box" style="max-width: 300px;">
      <h4>Example Data</h4>
      <p>Select a demonstration dataset to load:</p>

      <div class="dialog-buttons" style="flex-direction: column; gap: 8px;">
        <button class="btn btn-primary demo-dataset-btn" data-file="demo_directed" style="width:100%;">Directed/Weighted
          (10)</button>
        <button class="btn btn-primary demo-dataset-btn" data-file="demo_large" style="width:100%;">Large ER
          (50)</button>
        <button class="btn btn-primary demo-dataset-btn" data-file="demo_bipartite" style="width:100%;">Bipartite
          (Basic)</button>
        <button class="btn btn-primary demo-dataset-btn" data-file="demo_bipartite_bartomeus"
          style="width:100%;">Bipartite (Bartomeus Modified)</button>
        <button class="btn" id="demoCancelBtn" style="width:100%; margin-top: 8px;">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
